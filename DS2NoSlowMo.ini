[Features]
; Changes take effect after restarting the game.
; 1 = disable enemy-defeat slowdown (human and machine enemies); 0 = keep it.
; Default when omitted: 1.
DisableEnemyDefeatSlowMo=1
; 1 = disable the shared request observed for cryptobiotes, electric bugs and chiral crystals.
; Default when omitted: 1.
DisablePickupSlowMo=1
; 1 = skip the vehicle shutdown entry during a BT area encounter; 0 = keep it.
; Default when omitted: 0.
DisableBTVehicleShutdown=0
